<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="资金总览；供应链与 ISV 页面使用示例数据。" />
    <link rel="icon" href="data:," />
    <title>现金流量表｜ISV · 资金总览</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --border: #e5eaf0;
        --border-deep: #d5dce6;
        --blue: #5b91d9;
        --blue-hover: #4c83c8;
        --blue-bg: #eef5fc;
        --blue-border: #d9e7f5;
        --green: #8fbb58;
        --red: #d96b66;
        --purple: #7777ae;
        --orange: #e9a25f;
        --t-title: #202733;
        --t-module: #303a4a;
        --t-body: #465164;
        --t-sub: #7c8799;
        --t-weak: #9ba5b4;
        --grid-line: #eef1f5;
        --sum-bg: #f2f6fb;
        --hover-bg: #f5f9fe;
        --radius: 8px;
        --shadow: 0 1px 3px rgba(20, 35, 60, 0.04);
        --shadow-drop: 0 4px 16px rgba(20, 35, 60, 0.08);
        --sidebar-width: 212px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        color-scheme: light;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizelegibility;
      }

      body {
        min-width: 320px;
        color: var(--t-body);
        background: var(--bg);
        font-family:
          Inter,
          'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(91, 145, 217, 0.14);
      }

      [hidden] {
        display: none !important;
      }

      .skip-link {
        position: fixed;
        z-index: 400;
        top: 10px;
        left: 10px;
        padding: 8px 12px;
        color: var(--t-title);
        text-decoration: none;
        background: var(--card);
        border: 1px solid var(--blue);
        border-radius: var(--radius);
        box-shadow: var(--shadow-drop);
        transform: translateY(-170%);
        transition: transform 0.15s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .app-shell {
        min-height: 100vh;
      }

      .container {
        width: 100%;
        padding-right: 24px;
        padding-left: 28px;
      }

      .sidebar {
        position: fixed;
        z-index: 120;
        inset: 0 auto 0 0;
        display: flex;
        width: var(--sidebar-width);
        flex-direction: column;
        background: var(--card);
        border-right: 1px solid var(--border);
      }

      .side-brand {
        display: flex;
        height: 64px;
        flex-shrink: 0;
        gap: 10px;
        align-items: center;
        padding: 0 20px;
        color: var(--t-title);
        font-size: 16px;
        font-weight: 600;
        border-bottom: 1px solid var(--grid-line);
      }

      .brand-mark {
        display: grid;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        color: #fff;
        background: linear-gradient(135deg, #7fabdf, var(--blue));
        border-radius: 7px;
        box-shadow: 0 1px 3px rgba(76, 131, 200, 0.28);
        place-items: center;
      }

      .brand-mark svg {
        width: 14px;
        height: 14px;
      }

      .side-nav {
        flex: 1;
        padding: 10px 12px 16px;
        overflow-y: auto;
      }

      .nav-item {
        position: relative;
        display: flex;
        gap: 9px;
        align-items: center;
        margin: 2px 0;
        padding: 7px 10px;
        color: var(--t-body);
        font-size: 13px;
        text-decoration: none;
        white-space: nowrap;
        border-radius: 6px;
        transition:
          color 0.12s ease,
          background 0.12s ease;
      }

      .nav-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--t-sub);
      }

      .nav-item:hover {
        background: var(--hover-bg);
      }

      .nav-item[aria-disabled='true'] {
        cursor: default;
      }

      .nav-item.active {
        color: var(--blue-hover);
        font-weight: 500;
        background: var(--blue-bg);
      }

      .nav-item.active svg {
        color: var(--blue-hover);
      }

      .nav-item.active::before {
        position: absolute;
        top: 50%;
        left: 0;
        width: 3px;
        height: 15px;
        background: var(--blue-hover);
        border-radius: 0 2px 2px 0;
        content: '';
        transform: translateY(-50%);
      }

      .app-main {
        min-width: 0;
        margin-left: var(--sidebar-width);
      }

      .page-header {
        position: sticky;
        z-index: 90;
        top: 0;
        background: rgba(255, 255, 255, 0.98);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(20, 35, 60, 0.04);
      }

      .header-row {
        display: flex;
        min-height: 48px;
        gap: 18px;
        align-items: stretch;
        justify-content: space-between;
      }

      .tabs-wrap {
        display: flex;
        min-width: 0;
        align-items: stretch;
      }

      .tabs-list {
        display: flex;
        min-width: 0;
        gap: 26px;
        align-items: stretch;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs-list::-webkit-scrollbar {
        display: none;
      }

      .tab-item {
        position: relative;
        flex: 0 0 auto;
        padding: 0;
        color: var(--t-sub);
        background: transparent;
        border: 0;
        cursor: pointer;
        transition: color 0.12s ease;
      }

      .tab-item:hover {
        color: var(--blue-hover);
      }

      .tab-item[aria-selected='true'] {
        color: var(--t-title);
        font-weight: 600;
      }

      .tab-item[aria-selected='true']::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 2px;
        background: var(--blue);
        content: '';
      }

      .header-meta {
        display: flex;
        flex: 0 0 auto;
        gap: 12px;
        align-items: center;
        color: var(--t-sub);
        font-size: 12px;
        white-space: nowrap;
      }

      .status-chip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 3px 8px;
        color: var(--blue-hover);
        background: var(--blue-bg);
        border: 1px solid var(--blue-border);
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 500;
      }

      .status-chip::before {
        width: 6px;
        height: 6px;
        background: currentcolor;
        border-radius: 50%;
        content: '';
      }

      .mobile-menu-button,
      .sidebar-scrim {
        display: none;
      }

      .page-content {
        padding-top: 20px;
        padding-bottom: 32px;
      }

      .page-view {
        min-width: 0;
      }

      .report-root {
        container-type: inline-size;
      }

      .report-head {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .report-title-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .report-head h1 {
        color: var(--t-title);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      .report-head p {
        max-width: 760px;
        margin-top: 4px;
        color: var(--t-sub);
        font-size: 13px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .chart-card,
      .quarter-card,
      .category-card,
      .table-card {
        transition:
          border-color 0.12s ease,
          box-shadow 0.12s ease;
      }

      .chart-card:hover,
      .quarter-card:hover,
      .category-card:hover,
      .table-card:hover {
        border-color: var(--border-deep);
        box-shadow: 0 2px 6px rgba(20, 35, 60, 0.06);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .kpi-card {
        min-height: 94px;
        padding: 13px 16px;
        transition:
          border-color 0.12s ease,
          box-shadow 0.12s ease;
      }

      .kpi-card:hover {
        border-color: var(--border-deep);
        box-shadow: 0 2px 6px rgba(20, 35, 60, 0.06);
      }

      .kpi-label {
        color: var(--t-sub);
        font-size: 12.5px;
        font-weight: 500;
      }

      .kpi-value {
        margin-top: 7px;
        color: var(--t-title);
        font-size: 26px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.4px;
        line-height: 1.15;
      }

      .kpi-value.is-negative,
      .number.is-negative {
        color: var(--red);
      }

      .kpi-value.is-positive {
        color: var(--blue-hover);
      }

      .section-block {
        margin-top: 20px;
      }

      .report-root > .section-block:first-child {
        margin-top: 0;
      }

      .section-head {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .section-head h2 {
        color: var(--t-module);
        font-size: 18px;
        font-weight: 600;
      }

      .section-head p {
        margin-top: 2px;
        color: var(--t-sub);
        font-size: 12.5px;
      }

      .secondary-button {
        display: inline-flex;
        flex: 0 0 auto;
        gap: 6px;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 6px 11px;
        color: var(--t-body);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        transition:
          color 0.12s ease,
          border-color 0.12s ease,
          background 0.12s ease;
      }

      .secondary-button:hover {
        color: var(--blue-hover);
        background: var(--hover-bg);
        border-color: var(--blue-border);
      }

      .secondary-button svg {
        width: 14px;
        height: 14px;
        transition: transform 0.15s ease;
      }

      .secondary-button[aria-expanded='true'] svg {
        transform: rotate(180deg);
      }

      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(240px, 0.72fr);
        gap: 14px;
      }

      .chart-card,
      .quarter-card,
      .category-card {
        padding: 14px 16px;
      }

      .card-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .card-head h3 {
        color: var(--t-module);
        font-size: 14px;
        font-weight: 600;
      }

      .card-head p {
        margin-top: 2px;
        color: var(--t-weak);
        font-size: 11.5px;
      }

      .legend {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--t-sub);
        font-size: 11.5px;
      }

      .legend-item {
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }

      .legend-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .legend-dot.positive {
        background: var(--green);
      }

      .legend-dot.negative {
        background: var(--red);
      }

      .net-chart {
        width: 100%;
        height: 232px;
        margin-top: 10px;
      }

      .chart-fallback {
        display: grid;
        min-height: 232px;
        margin-top: 10px;
        padding: 20px;
        color: var(--t-sub);
        background: var(--bg);
        border: 1px dashed var(--border-deep);
        border-radius: 7px;
        font-size: 12.5px;
        text-align: center;
        place-items: center;
      }

      .quarter-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .quarter-row {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--grid-line);
        border-radius: 7px;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          box-shadow 0.12s ease;
      }

      .quarter-row:hover {
        background: var(--hover-bg);
        border-color: var(--blue-border);
      }

      .quarter-name {
        color: var(--t-sub);
        font-size: 12px;
      }

      .quarter-months {
        display: block;
        margin-top: 1px;
        color: var(--t-weak);
        font-size: 10.5px;
      }

      .quarter-value {
        color: var(--t-module);
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .quarter-value.is-negative {
        color: var(--red);
      }

      .category-grid {
        --category-columns: var(--category-total);

        display: grid;
        grid-template-columns: repeat(var(--category-columns), minmax(0, 1fr));
        gap: 12px;
      }

      .category-card {
        display: grid;
        gap: 9px;
        padding: 12px 14px;
      }

      .category-name {
        min-width: 0;
        color: var(--t-sub);
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.4;
      }

      .category-value {
        color: var(--t-module);
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }

      .category-value.is-negative {
        color: var(--red);
      }

      .table-card {
        padding: 0;
        overflow: hidden;
      }

      .table-card-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 13px 16px 10px;
        border-bottom: 1px solid var(--border);
      }

      .table-card-head h3 {
        color: var(--t-module);
        font-size: 14px;
        font-weight: 600;
      }

      .table-card-head p {
        margin-top: 2px;
        color: var(--t-weak);
        font-size: 11.5px;
      }

      .table-scroll {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      .monthly-table,
      .subject-table {
        min-width: 1040px;
      }

      .monthly-table-card .table-card-head {
        padding: 11px 16px 8px;
      }

      .monthly-table th,
      .monthly-table td {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      th {
        padding: 8px 10px;
        color: var(--t-sub);
        font-size: 11.5px;
        font-weight: 500;
        text-align: right;
        white-space: nowrap;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      td {
        padding: 8px 10px;
        color: var(--t-body);
        font-size: 12.5px;
        text-align: right;
        white-space: nowrap;
        border-bottom: 1px solid var(--grid-line);
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: var(--hover-bg);
      }

      .monthly-table th:first-child,
      .monthly-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        min-width: 104px;
        color: var(--t-module);
        font-weight: 500;
        background: var(--card);
      }

      .monthly-table th:first-child {
        z-index: 3;
        background: var(--bg);
      }

      .monthly-table .net-row td {
        color: var(--t-module);
        font-weight: 600;
        background: var(--sum-bg);
        border-top: 1px solid var(--border);
      }

      .monthly-table .net-row td.is-negative {
        color: var(--red);
      }

      .current-period {
        color: var(--blue-hover) !important;
        background: #f7fbff !important;
      }

      .subject-table th:first-child,
      .subject-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 2;
        width: 210px;
        min-width: 210px;
        max-width: 210px;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--card);
      }

      .subject-table th:first-child {
        z-index: 3;
        background: var(--bg);
      }

      .subject-table .group-row td {
        color: var(--t-module);
        font-weight: 600;
        background: var(--sum-bg);
        border-top: 1px solid var(--border);
      }

      .subject-table .group-row td:first-child {
        background: var(--sum-bg);
      }

      .subject-table .detail-row td:first-child {
        padding-left: 24px;
        color: var(--t-body);
        font-weight: 400;
      }

      .subject-table .detail-row.is-all-zero td,
      .subject-table .detail-row.is-all-zero td:first-child {
        color: var(--t-weak);
        background: #fbfcfe;
      }

      .subject-table .detail-row.is-all-zero .current-period {
        color: var(--t-weak) !important;
        background: #f7f9fc !important;
      }

      .subject-table .detail-row.is-all-zero:hover td {
        background: var(--hover-bg);
      }

      .number.is-zero {
        color: var(--t-weak);
      }

      .detail-unit-note {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--t-weak);
        font-size: 11px;
      }

      .detail-unit-note svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }

      .methodology-disclosure {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 20px;
      }

      .methodology-button svg:first-child {
        transform: none !important;
      }

      .methodology-panel {
        width: 100%;
        margin-top: 8px;
        padding: 13px 16px;
        background: #fbfcfe;
      }

      .methodology-panel ul {
        display: grid;
        gap: 4px;
        padding-left: 18px;
        color: var(--t-sub);
        font-size: 12px;
      }

      .methodology-panel .risk-note {
        color: #ad514c;
        font-weight: 500;
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      .placeholder-head {
        margin-bottom: 14px;
      }

      .placeholder-head h1 {
        color: var(--t-title);
        font-size: 22px;
        font-weight: 600;
      }

      .placeholder-head p {
        margin-top: 4px;
        color: var(--t-sub);
        font-size: 13px;
      }

      .empty-state {
        display: grid;
        min-height: 360px;
        padding: 36px 20px;
        text-align: center;
        place-items: center;
      }

      .empty-state-content {
        max-width: 460px;
      }

      .empty-icon {
        display: grid;
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        color: var(--blue-hover);
        background: var(--blue-bg);
        border: 1px solid var(--blue-border);
        border-radius: 12px;
        place-items: center;
      }

      .empty-icon svg {
        width: 23px;
        height: 23px;
      }

      .empty-state h2 {
        color: var(--t-module);
        font-size: 16px;
        font-weight: 600;
      }

      @container (max-width: 1040px) {
        .category-grid[data-category-count='7'] {
          --category-columns: 4;
        }
      }

      @container (max-width: 620px) {
        .category-grid {
          --category-columns: 2;
        }
      }

      @container (max-width: 420px) {
        .category-grid {
          --category-columns: 1;
        }
      }

      @media (max-width: 1180px) {
        .overview-grid {
          grid-template-columns: minmax(0, 1fr) 240px;
        }
      }

      @media (max-width: 980px) {
        .sidebar {
          box-shadow: var(--shadow-drop);
          transform: translateX(-105%);
          transition: transform 0.15s ease;
        }

        body.menu-open {
          overflow: hidden;
        }

        body.menu-open .sidebar {
          transform: translateX(0);
        }

        .sidebar-scrim {
          position: fixed;
          z-index: 110;
          inset: 0;
          width: 100%;
          height: 100%;
          background: rgba(32, 39, 51, 0.24);
          border: 0;
          cursor: pointer;
        }

        body.menu-open .sidebar-scrim {
          display: block;
        }

        .app-main {
          margin-left: 0;
        }

        .mobile-menu-button {
          display: grid;
          width: 34px;
          height: 34px;
          flex: 0 0 auto;
          align-self: center;
          color: var(--t-body);
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 6px;
          cursor: pointer;
          place-items: center;
        }

        .mobile-menu-button svg {
          width: 17px;
          height: 17px;
        }

        .tabs-wrap {
          min-width: 0;
          gap: 12px;
        }

        .overview-grid {
          grid-template-columns: 1fr;
        }

        .quarter-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .container {
          padding-right: 16px;
          padding-left: 16px;
        }

        .header-row {
          min-height: 52px;
        }

        .tabs-list {

        const VIEW_META = {

        const CURRENT_MONTH_INDEX = 7;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const chartInstances = new Map();

        const escapeHtml = (value) =>
          String(value).replace(/[&<>'"]/g, (character) => {
            const entities = {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              "'": '&#39;',
              '"': '&quot;',
            };
            return entities[character];

        const classForValue = (value) => {
          if (value < 0) return 'is-negative';

          return 'is-zero';
        };

        const formatWan = (value, digits = 1) => `${Number(value).toFixed(digits)}万`;

        const formatDetailWan = (rawValue) => {
          if (rawValue === 0) return '0';
          return (rawValue / 10000).toFixed(2);
        };

        const renderKpis = (report) => {
          const currentNet = report.summary.net[7];
          const cards = [
            { label: '累计收入', value: report.summary.incomeTotal },

        const renderNetChart = (reportKey, report) => {

        const renderMonthlyTable = (report) => {
          const header = MONTHS.map(

          const renderRow = (label, values, total, extraClass = '') => {
            const cells = values
              .map(
                (value, index) =>
                  `<td class="number ${classForValue(value)} ${index === CURRENT_MONTH_INDEX ? 'current-period' : ''}">${formatWan(value)}</td>`,

          return `

        const renderSubjectTable = (title, groups, reportKey) => {
          const header = MONTHS.map(

          ).join('');

          const body = groups
            .map((group) => {
              const groupCells = group.values
                .map(
                  (value, index) =>
                    `<td class="number ${classForValue(value)} ${index === 7 ? 'current-period' : ''}">${formatWan(value)}</td>`,
                )
                .join('');

              const detailRows = group.rows
                .map((row) => {
                  const isAllZero = row.values.every((value) => value === 0) && row.total === 0;
                  const cells = row.values
                    .map(
                      (value, index) => `
                        <td
                          class="number ${classForValue(value)} ${index === 7 ? 'current-period' : ''}"
                        >${formatDetailWan(value)}</td>`,
                    )
                    .join('');
                  return `
                    <tr class="detail-row${isAllZero ? ' is-all-zero' : ''}" data-detail-for="${escapeHtml(reportKey)}">
                      <td title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</td>
                      ${cells}
                      <td class="number ${classForValue(row.total)}">${formatWan(row.total)}</td>
                    </tr>`;
                })
                .join('');

              return `
                <tr class="group-row">
                  <td title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</td>
                  ${groupCells}
                  <td class="number ${classForValue(group.total)}">${formatWan(group.total)}</td>

                ${detailRows}`;
            })
            .join('');

          return `
            <article class="card table-card">
              <div class="table-card-head">
                <div>
                  <h3>${escapeHtml(title)}</h3>

                <span class="detail-unit-note">

        const renderMethodology = (reportKey) => `

        const renderReport = (reportKey, target) => {

        const buildNetChartOption = (reportKey) => {
          const report = REPORTS[reportKey];

          return {
            animation: !prefersReducedMotion,
            animationDuration: 500,
            animationDurationUpdate: 200,
            animationEasing: 'cubicOut',
            textStyle: {
              color: '#465164',
              fontFamily:
                'Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif',
            },
            grid: { top: 28, right: 12, bottom: 26, left: 12, containLabel: true },
            tooltip: {
              trigger: 'axis',
              triggerOn: 'mousemove',
              alwaysShowContent: false,
              hideDelay: 60,
              confine: true,
              backgroundColor: '#ffffff',
              borderColor: '#e5eaf0',
              borderWidth: 1,
              padding: [9, 11],
              textStyle: { color: '#465164', fontSize: 12 },
              extraCssText: 'box-shadow:0 4px 16px rgba(20,35,60,.08);border-radius:7px;',
              axisPointer: {
                type: 'shadow',
                shadowStyle: { color: 'rgba(91,145,217,.08)' },
              },
              formatter: (items) => {
                const item = Array.isArray(items) ? items[0] : items;
                const value = Number(item.value);
                const color = value > 0 ? '#8fbb58' : value < 0 ? '#d96b66' : '#9ba5b4';
                return `<div style="min-width:112px"><div style="margin-bottom:5px;color:#303a4a;font-weight:600">${escapeHtml(item.axisValue)}</div><div style="display:flex;gap:14px;align-items:center;justify-content:space-between"><span style="color:#7c8799">结余</span><strong style="color:${color};font-variant-numeric:tabular-nums">${formatWan(value)}</strong></div></div>`;
              },
            },
            xAxis: {
              type: 'category',
              data: MONTHS,
              axisTick: { show: false },
              axisLine: { lineStyle: { color: '#e5eaf0' } },
              axisLabel: {
                interval: 0,
                margin: 11,
                formatter: (value, index) =>
                  `{${index === CURRENT_MONTH_INDEX ? 'current' : 'normal'}|${value}}`,
                rich: {

            series: [
              {
                name: '结余',
                type: 'bar',
                barMaxWidth: 28,
                data: report.summary.net.map((value, index) => {
                  const current = index === CURRENT_MONTH_INDEX;
                  const color = value > 0 ? '#8fbb58' : value < 0 ? '#d96b66' : '#9ba5b4';
                  return {
                    value,
                    itemStyle: {
                      color,
                      borderColor: current ? '#d9e7f5' : 'transparent',
                      borderWidth: current ? 1 : 0,
                      borderRadius: value >= 0 ? [3, 3, 0, 0] : [0, 0, 3, 3],
                    },
                    label: {
                      show: true,
                      position: value >= 0 ? 'top' : 'bottom',
                      distance: 5,
                      color,
                      fontSize: 10.5,
                      formatter: formatWan(value),

        const ensureChart = (reportKey) => {
          const chartElement = document.getElementById(`${reportKey}-net-chart`);
          const fallback = document.getElementById(`${reportKey}-chart-fallback`);
          if (!chartElement || !REPORTS[reportKey]) return;

          if (!window.echarts) {
            chartElement.hidden = true;
            if (fallback) fallback.hidden = false;
            return;
          }

          chartElement.hidden = false;
          if (fallback) fallback.hidden = true;

          let chart = chartInstances.get(reportKey);
          if (!chart) {
            chart = window.echarts.init(chartElement, null, { renderer: 'canvas' });
            chartInstances.set(reportKey, chart);
          }

          chart.setOption(buildNetChartOption(reportKey), { notMerge: true, lazyUpdate: false });
          requestAnimationFrame(() => chart.resize());
        };

        const ensureChartForView = (viewId) => {
          const match = Object.entries(REPORTS).find(([, report]) => report.viewId === viewId);
          if (match) ensureChart(match[0]);
        };

        document.querySelectorAll('.report-root').forEach((target) => {
          renderReport(target.dataset.reportKey, target);
        });

        const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
        const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
        const headerStatus = document.getElementById('headerStatus');
        const defaultView = 'cashflow-isv';

        const activateView = (viewId, options = {}) => {
          const safeView = VIEW_META[viewId] ? viewId : defaultView;
          const { focusTab = false, updateHash = false } = options;

          tabs.forEach((tab) => {
            const active = tab.dataset.view === safeView;
            tab.setAttribute('aria-selected', String(active));
            tab.tabIndex = active ? 0 : -1;
            if (active && focusTab) tab.focus();
          });

          panels.forEach((panel) => {
            panel.hidden = panel.id !== `panel-${safeView}`;
          });

          const meta = VIEW_META[safeView];
          headerStatus.textContent = meta.status;
          document.title = `${meta.title} · 资金总览`;
          requestAnimationFrame(() => ensureChartForView(safeView));

          if (updateHash && window.location.hash !== `#${safeView}`) {
            window.location.hash = safeView;
          }
        };

        tabs.forEach((tab, index) => {
          tab.addEventListener('click', () => activateView(tab.dataset.view, { updateHash: true }));
          tab.addEventListener('keydown', (event) => {
            const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
            if (!keys.includes(event.key)) return;
            event.preventDefault();

            let nextIndex = index;
            if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
            if (event.key === 'Home') nextIndex = 0;
            if (event.key === 'End') nextIndex = tabs.length - 1;
            activateView(tabs[nextIndex].dataset.view, { focusTab: true, updateHash: true });
          });
        });

        window.addEventListener('hashchange', () => {
          activateView(window.location.hash.slice(1) || defaultView);
        });

        document.addEventListener('click', (event) => {
          const button = event.target.closest('[data-action]');
          if (!button) return;

          const action = button.dataset.action;
          if (action === 'toggle-details') {
            const reportKey = button.dataset.reportKey;
            const expanded = button.getAttribute('aria-expanded') === 'true';
            button.setAttribute('aria-expanded', String(!expanded));
            button.querySelector('span').textContent = expanded ? '展开科目明细' : '收起科目明细';
            document.querySelectorAll(`[data-detail-for="${reportKey}"]`).forEach((row) => {
              row.hidden = expanded;
            });
            return;
          }

          if (action === 'toggle-methodology') {
            const panel = document.getElementById(button.getAttribute('aria-controls'));
            if (!panel) return;
            const expanded = button.getAttribute('aria-expanded') === 'true';
            button.setAttribute('aria-expanded', String(!expanded));
            panel.hidden = expanded;
          }
        });

        const menuButton = document.getElementById('menuButton');
        const sidebarScrim = document.getElementById('sidebarScrim');

        const setMenuOpen = (open) => {
          const mobile = window.innerWidth <= 980;
          const shouldOpen = mobile && open;
          document.body.classList.toggle('menu-open', shouldOpen);
          menuButton.setAttribute('aria-expanded', String(shouldOpen));
          sidebarScrim.tabIndex = shouldOpen ? 0 : -1;
        };

        menuButton.addEventListener('click', () => {
          setMenuOpen(!document.body.classList.contains('menu-open'));
        });
        sidebarScrim.addEventListener('click', () => setMenuOpen(false));
        window.addEventListener('resize', () => {
          if (window.innerWidth > 980) setMenuOpen(false);
          chartInstances.forEach((chart, reportKey) => {
            const chartElement = document.getElementById(`${reportKey}-net-chart`);
            if (chartElement && chartElement.offsetParent !== null) chart.resize();
          });
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') setMenuOpen(false);
        });

        const initialView = window.location.hash.slice(1);
        activateView(VIEW_META[initialView] ? initialView : defaultView);
        if (!VIEW_META[initialView]) {
          window.history.replaceState(null, '', `#${defaultView}`);
        }
      })();
    </script>
  </body>
</html>
